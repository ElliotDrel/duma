[package]
name = "duma-core"
description = "Duma engine: threads, versions, prompts, the dictation and edit pipeline, and the event log"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["audio"]
audio = ["duma-platform/audio"]

[dependencies]
duma-openai.workspace = true
duma-platform = { workspace = true, default-features = false }
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
uuid.workspace = true
dirs = "6"
hound = "3.5"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
rusqlite = { version = "0.37", features = ["bundled"] }
similar = "2"

[dev-dependencies]
tempfile = "3"
