[package]
name = "duma-platform"
description = "Native OS layer for Duma: hotkeys, microphone, focused text field access, clipboard and paste"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["audio"]
# Microphone capture. Off only for cross-target `cargo check` from Windows, where CoreAudio bindgen cannot run.
audio = ["dep:handy-recorder"]

[dependencies]
anyhow.workspace = true
log.workspace = true
serde.workspace = true
handy-keys = "0.3.5"
handy-recorder = { version = "0.1.1", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.2"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSWorkspace"] }
