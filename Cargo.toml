[workspace]
resolver = "3"
members = ["crates/duma-openai", "crates/duma-platform", "crates/duma-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
duma-core = { path = "crates/duma-core" }
duma-openai = { path = "crates/duma-openai" }
duma-platform = { path = "crates/duma-platform" }
anyhow = "1"
base64 = "0.22"
futures-util = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "local-offset", "serde", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
uuid = { version = "1", features = ["v7", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
